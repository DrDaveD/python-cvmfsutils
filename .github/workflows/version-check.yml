name: Spec File Check

on:
  push:
    branches: [ devel, "feature/*", "fix/*", "refactor/*" ]
  pull_request:
    branches: [ devel ]

jobs:
  spec-check:
    name: Verify spec file consistency
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.8.1

    - name: Verify checked-in spec matches generated
      run: |
        # Save the checked-in spec
        cp rpm/python-cvmfsutils.spec /tmp/checked-in.spec

        # Generate a fresh spec file
        pixi run generate-spec

        # Compare
        if diff -q /tmp/checked-in.spec rpm/python-cvmfsutils.spec > /dev/null; then
          echo "✓ Checked-in spec file matches generated spec"
        else
          echo "✗ Checked-in spec file differs from generated spec!"
          echo "  Run 'pixi run generate-spec' and commit the result"
          diff /tmp/checked-in.spec rpm/python-cvmfsutils.spec || true
          exit 1
        fi

    - name: Verify spec file has no external macros
      run: |
        # Check that the spec file doesn't use %{version} macro
        if grep -q "%{version}" rpm/python-cvmfsutils.spec; then
          echo "✗ Spec file still contains %{version} macro - should be replaced with actual version"
          exit 1
        else
          echo "✓ Spec file does not use external version macro"
        fi
